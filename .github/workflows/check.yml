name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pinned: the result must change only when this repository changes, not with each release.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.308

      - name: Validate the plugin as Claude Code does
        run: |
          claude --version
          claude plugin validate --strict .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the directory rules check
        run: python3 -m unittest scripts/test_check.py

      - name: Run the directory rules check
        run: python3 scripts/check.py

      - name: Test the upload archives
        run: bash scripts/test_build_zip.sh
